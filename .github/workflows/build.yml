name: Compilar LineageOS para Vili (Max Space)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Autenticar repositorio
        uses: actions/checkout@v4

      - name: Maximizar espacio y migrar a /mnt
        run: |
          echo "=== Liberando espacio del disco principal ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /var/lib/docker /var/lib/containerd
          sudo apt-get clean
          
          echo "=== Creando directorio de trabajo en /mnt ==="
          sudo mkdir -p /mnt/android
          sudo chown -R $USER:$USER /mnt/android
          ln -s /mnt/android ~/android-workspace
          
          echo "=== Espacio disponible tras la limpieza ==="
          df -h

      - name: Configurar entorno de Android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev libncurses5

      - name: Instalar Repo y configurar Git
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

      - name: Sincronizar fuentes de LineageOS y Vili (Modo Ultraligero)
        run: |
          cd ~/android-workspace
          ~/bin/repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs --depth=1
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository_owner }}/local_manifests.git .repo/local_manifests
          ~/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --current-branch --fail-fast

          - name: Parchear incompatibilidad de install_symlink para Android 12
        run: |
          cd ~/android-workspace
          if [ -f "vendor/xiaomi/sm8350-common/Android.bp" ]; then
            echo "Eliminando bloques install_symlink incompatibles..."
            sed -i '/install_symlink {/,/}/d' vendor/xiaomi/sm8350-common/Android.bp || true
          fi

      - name: Compilar ROM
        run: |
          cd ~/android-workspace
          source build/envsetup.sh
          lunch lineage_vili-userdebug
          mka bacon -j$(nproc --all)

      - name: Guardar la ROM compilada
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-Vili-Zip
          path: /mnt/android/out/target/product/vili/*.zip
